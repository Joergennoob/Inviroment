name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate cards
        run: python3 scripts/validate_cards.py
      - name: Check generated markdown, map data, coverage and overview
        run: |
          python3 scripts/render_markdown.py --check
          python3 scripts/build_geojson.py --check
          python3 scripts/coverage.py --check
          python3 scripts/render_overview.py --check
      - name: Install and build the map
        run: npm ci && npm run build
